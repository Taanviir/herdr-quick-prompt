name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the version
        id: version
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml)
          package=$(node -p "require('./package.json').version")
          if [ "$manifest" != "$package" ]; then
            echo "herdr-plugin.toml $manifest, package.json $package" >&2
            exit 1
          fi
          echo "tag=v$manifest" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$manifest" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.released != 'true'
        run: node --test

      - name: Create the GitHub release
        if: steps.version.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Install or update:

          \`\`\`bash
          herdr plugin install Taanviir/herdr-quick-prompt --ref $TAG
          \`\`\`
          "
