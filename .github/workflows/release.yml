name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test

      - name: Tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml)
          package=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$package" ]; then
            echo "tag v$tag, herdr-plugin.toml $manifest, package.json $package" >&2
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Install or update:

          \`\`\`bash
          herdr plugin install Taanviir/herdr-quick-prompt --ref $GITHUB_REF_NAME
          \`\`\`
          "
